name: Create release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Package static app
        run: |
          mkdir -p release/MarinePath
          cp index.html README.md LICENSE PRIVACY.md THIRD_PARTY_NOTICES.md CHANGELOG.md release/MarinePath/
          cp -R data assets release/MarinePath/
          cd release
          zip -rq "MarinePath-${GITHUB_REF_NAME}.zip" MarinePath
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "release/MarinePath-${GITHUB_REF_NAME}.zip"
          --title "MarinePath ${GITHUB_REF_NAME} — GitHub Pages edition"
          --notes-file CHANGELOG.md
